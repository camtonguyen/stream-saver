<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header><h1>Stream Saver</h1></header>
  <p class="hint">Press <b>⬇ MP4</b> on any video to save it as one MP4. Start playing the video first so it can be detected.</p>

  <h2>File name</h2>
  <input id="tpl" type="text" spellcheck="false">
  <p class="hint">Tokens: <code>{title}</code> page title · <code>{site}</code> website · <code>{date}</code> today. Example: <code>{site} - {title}</code></p>
  <p class="hint" id="preview"></p>

  <h2>Button on this site</h2>
  <label><input id="on" type="checkbox"> Show the button on <b id="host"></b></label>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
